[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnirank"
version = "0.1.1"
description = "SEO, AEO, GEO and SMM growth engine"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "S M Moshiur Rahman", email = "moshiur@publicpulse.com.bd" }]
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "respx>=0.21", "ruff>=0.5", "rfc3339-validator>=0.1.4", "pyyaml>=6.0", "pillow>=10.0"]

[project.scripts]
omnirank = "omnirank.cli:main"

[tool.setuptools.packages.find]
include = ["omnirank*"]

[tool.ruff]
line-length = 100
